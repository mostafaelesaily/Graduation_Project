name: medlink
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  go_router: ^18.1.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_bloc: ^9.1.1
  smooth_page_indicator: ^2.0.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets: 
    - assets/logo/
    - assets/svgs/
    - assets/lotties/
    - assets/images/
  fonts:
    - family: LiberationSans
      fonts:
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSans-Italic.ttf
          style: italic
        - asset: assets/fonts/liberation-fonts-ttf-2.1.5/LiberationSans-BoldItalic.ttf
          weight: 700
          style: italic
